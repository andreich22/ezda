services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ezda
      POSTGRES_USER: ezda
      POSTGRES_PASSWORD: ezda
    ports:
      - "5432:5432"
    volumes:
      - ezda_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ezda -d ezda"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  auth-db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_DB: supabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:-supabase_admin}
    volumes:
      - ./docker-supabase/volumes/db:/docker-entrypoint-initdb.d:Z
      - ezda_supabase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supabase"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_API_EXTERNAL_URL:-http://localhost:3000/auth/v1}
      # GoTrue v2 serves its routes at the root; the `auth-proxy` (nginx) strips
      # the /auth/v1 prefix the app always sends. Do NOT set GOTRUE_API_PATH_PREFIX
      # here — it is inert in v2 and would double-prefix on a future upgrade.
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_POSTGRES_PASSWORD:-supabase_admin}@auth-db:5432/supabase
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_ADDITIONAL_REDIRECT_URLS:-localhost:3000}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-jwt-secret-change-me}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Auto-confirm for reliable local signup. Set to "false" to require the
      # email-confirmation flow (then point an SMTP server at gotrue). The E2E
      # auth test uses its own mock provider and is unaffected by this value.
      GOTRUE_MAILER_AUTOCONFIRM: "${SUPABASE_MAILER_AUTOCONFIRM:-true}"
    expose:
      - "9999"
  auth-proxy:
    image: nginx:alpine
    depends_on:
      - auth
    volumes:
      - ./docker-supabase/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8000"
    ports:
      - "${SUPABASE_DEBUG_PORT:-8000}:8000"
  migrate:
    build: .
    image: ezda-app
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DATABASE_URL: postgres://ezda:ezda@db:5432/ezda
    command: node scripts/migrate.mjs
    volumes:
      - .:/app
      - /app/node_modules
  app:
    build: .
    image: ezda-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgres://ezda:ezda@db:5432/ezda
      ORS_API_KEY: ${ORS_API_KEY:-}
      # Base Auth API URL (lib/auth.ts appends /auth/v1/...). Reachable from
      # inside the compose network by service name. For non-Docker local dev
      # point this at http://localhost:<gotrue-host-port>/auth/v1 base instead.
      SUPABASE_URL: ${SUPABASE_URL:-http://auth-proxy:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-dev-anon-key}
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
volumes:
  ezda_db:
  ezda_supabase_db:
