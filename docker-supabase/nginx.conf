# Local self-hosted Auth gateway.
# The app (lib/auth.ts) always calls ${SUPABASE_URL}/auth/v1/<endpoint>.
# Self-hosted GoTrue v2 serves its routes at the root, so this proxy strips the
# /auth/v1 prefix and forwards to GoTrue on :9999. This keeps lib/auth.ts and
# the E2E auth provider (which also serve/expect /auth/v1) unchanged, and
# mirrors how production Supabase exposes Auth behind its gateway.
server {
    listen 8000;
    server_name _;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://auth:9999/;
    }
}
