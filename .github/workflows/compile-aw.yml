name: Compile Agentic Workflow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/self-healing-ci-pr.md"

permissions:
  contents: write

jobs:
  compile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install gh-aw
        run: |
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash -s v0.89.15
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"
      - name: Compile
        run: gh aw compile .github/workflows/self-healing-ci-pr.md
      - name: Commit generated lock file
        run: |
          if git diff --quiet -- .github/workflows/self-healing-ci-pr.lock.yml; then
            echo "Lock file is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/self-healing-ci-pr.lock.yml
          git commit -m "fix: e102 | compile self-healing workflow"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
