name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate application version
        run: npm run version:check
      - run: npm run tasks:validate
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach /tmp/ezda-base origin/main
          trap 'git worktree remove --force /tmp/ezda-base' EXIT
          cd /tmp/ezda-base
          npm ci
          npm run test:coverage
          cd -
          if node scripts/check-coverage.mjs coverage/coverage-summary.json /tmp/ezda-base/coverage/coverage-summary.json; then
            echo "Coverage regression check passed."
          else
            echo "::warning::Coverage regression detected. This is informational and does not block CI."
          fi
      - run: npm run build
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.54.2
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run registration E2E
        run: npm run test:e2e:auth
      - name: Validate pull request task
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr-task.mjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
