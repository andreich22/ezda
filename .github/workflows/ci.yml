name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify PR branch is based on the latest target branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          base_ref="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          if [[ -z "$base_ref" || "$base_ref" == "null" || -z "$head_sha" || "$head_sha" == "null" ]]; then
            echo "::error::Could not determine PR target branch or head SHA; refusing to pass freshness check."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          base_sha="$(git rev-parse "refs/remotes/origin/${base_ref}^{commit}")"
          if ! git cat-file -e "${head_sha}^{commit}"; then
            echo "::error::PR head commit ${head_sha} is unavailable locally; refusing to pass freshness check."
            exit 1
          fi

          echo "Target branch: ${base_ref}"
          echo "Current target SHA: ${base_sha}"
          echo "PR head SHA: ${head_sha}"
          if git merge-base --is-ancestor "$base_sha" "$head_sha"; then
            echo "PR head includes the current target branch."
          else
            echo "::error::PR branch is behind the current target branch or cannot be proven up to date. Update/rebase the task branch from ${base_ref} and rerun CI."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify self-healing CI prompt exists
        run: test -s .github/workflows/self-healing-ci-pr.md
      - name: Validate pull request links to a GitHub Issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          issue_number="$(printf '%s\n' "$body" | grep -Eio '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | head -n 1 | tr -cd '0-9' || true)"
          if [ -z "$issue_number" ]; then
            echo "::error::PR body must link its primary GitHub Issue with Closes #<number>."
            exit 1
          fi
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json number,title,state >/dev/null
          head_branch="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
          if [[ ! "$head_branch" =~ ^task/${issue_number}-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::PR branch must match task/<issue-number>-<short-name>; got: $head_branch"
            exit 1
          fi
      - name: Validate application version
        run: npm run version:check
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach /tmp/ezda-base origin/main
          trap 'git worktree remove --force /tmp/ezda-base' EXIT
          cd /tmp/ezda-base
          npm ci
          npm run test:coverage
          cd -
          if node scripts/check-coverage.mjs coverage/coverage-summary.json /tmp/ezda-base/coverage/coverage-summary.json; then
            echo "Coverage regression check passed."
          else
            echo "::warning::Coverage regression detected. This is informational and does not block CI."
          fi
      - run: npm run build
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.54.2
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run registration E2E
        run: npm run test:e2e:auth
