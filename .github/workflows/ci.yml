name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tasks:validate
      - run: npm run build
      - name: Validate pull request task
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr-task.mjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
