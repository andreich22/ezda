name: Automatic application version bump

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: application-version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine whether merged change already bumped version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: version bump requested."
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous main commit is available; skipping automatic bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            echo "Previous main commit has no package.json; skipping automatic bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION="$(git show "$BEFORE_SHA:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version));')"

          echo "Previous main version: $PREVIOUS_VERSION"
          echo "Current main version:  $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Merged change did not modify the application version; creating a patch bump."
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merged change already modified the application version; no additional bump."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.version.outputs.needs_bump == 'true'
        run: npm version patch --no-git-tag-version

      - name: Validate application version
        if: steps.version.outputs.needs_bump == 'true'
        run: npm run version:check

      - name: Create version bump pull request
        if: steps.version.outputs.needs_bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/version-bump
          delete-branch: true
          commit-message: "chore: 7d3a | bump application version"
          title: "chore: 7d3a | bump application version"
          body: |
            Automatic application version bump after a change reached main without changing the application version.

            Task: TASK-7d3a
            Bump type: PATCH
            Source version: ${{ steps.version.outputs.current_version }}
            Target version: the next PATCH version

            The version change is delivered through a normal pull request; main is never updated directly by this job.
          labels: automated
