name: Supabase Preview migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'task/9e4a-')
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Drizzle migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Verify routes table
        run: node -e "const postgres = require('postgres'); const sql = postgres(process.env.DATABASE_URL, { prepare: false }); sql`SELECT to_regclass('public.routes') AS table_name`.then(r => { if (r[0]?.table_name !== 'routes') process.exit(1); console.log('routes table verified'); }).finally(() => sql.end());"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
